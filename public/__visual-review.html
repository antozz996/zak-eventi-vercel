<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>ZAK — verifica layout</title><style>body{margin:0;background:#444;font:14px Arial;color:white}header{height:44px;display:flex;gap:10px;align-items:center;justify-content:center}select,button{font:inherit;padding:5px}iframe{display:block;margin:auto;border:0;height:800px;background:white;width:390px;max-width:100%}</style></head><body><header><label>Larghezza <select id="width"><option value="390">Mobile 390</option><option value="320">Mobile 320</option><option value="430">Mobile 430</option><option value="768">Tablet 768</option><option value="1280">Desktop 1280</option></select></label><label>Altezza <select id="height"><option>800</option><option>667</option><option>568</option><option>900</option></select></label><label>Pagina <select id="route"></select></label><button id="top">Inizio</button></header><iframe title="Sito ZAK in verifica" src="/"></iframe><script>const routes=["/","/location","/eventi","/diciottesimi","/comunioni","/battesimi","/compleanni","/feste-private","/lauree","/servizi","/perche-scegliere-zak","/guide","/guide/come-scegliere-sala-diciottesimo-napoli","/guide/quanto-costa-diciottesimo-napoli","/guide/buffet-o-cena-servita-diciottesimo","/guide/checklist-diciottesimo","/guide/come-organizzare-comunione-napoli","/guide/quanto-prima-prenotare-sala-diciottesimo","/guide/allestimento-diciottesimo-napoli","/gallery","/contatti","/privacy-policy","/cookie-policy"];const frame=document.querySelector('iframe');routes.forEach(path=>route.add(new Option(path,path)));width.onchange=()=>frame.style.width=width.value+'px';route.onchange=()=>frame.src=route.value;document.querySelector('#height').onchange=e=>frame.style.height=e.target.value+'px';document.querySelector('#top').onclick=()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'});</script></body></html>
